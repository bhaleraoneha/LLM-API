<!DOCTYPE html>
<html>
<head>
    <title>StudyBuddy AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        #chatbox {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            margin: 12px 0;
        }

        input {
            width: 70%;
            padding: 12px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>StudyBuddy AI 🤖</h1>
    <p>Your AI Learning Assistant</p>

    <div id="chatbox"></div>

    <input
        type="text"
        id="message"
        placeholder="Ask me something..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

    <script>

        async function sendMessage() {

            const input =
                document.getElementById("message");

            const message = input.value.trim();

            if (!message) {
                return;
            }

            const chatbox =
                document.getElementById("chatbox");

            // Display user message
            chatbox.innerHTML += `
                <div class="message">
                    <b>You:</b> ${message}
                </div>
            `;

            input.value = "";

            try {

                const response = await fetch("/chat", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (data.error) {

                    chatbox.innerHTML += `
                        <div class="message">
                            <b>Error:</b> ${data.error}
                        </div>
                    `;

                } else {

                    chatbox.innerHTML += `
                        <div class="message">
                            <b>StudyBuddy:</b> ${data.reply}
                        </div>
                    `;
                }

            } catch (error) {

                chatbox.innerHTML += `
                    <div class="message">
                        <b>Error:</b>
                        Unable to connect to the server.
                    </div>
                `;
            }

            chatbox.scrollTop =
                chatbox.scrollHeight;
        }

    </script>

</body>
</html>
